[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-telegram-bot"
version = "0.1.0"
description = "A modular Telegram bot that fetches and publishes AI news."
requires-python = ">=3.10"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["news_bot_en.py", "news_bot_fa.py"]

[tool.ruff.lint]
select = ["F"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
